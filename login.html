<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In – Crypto Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <meta name="description" content="Sign in to access your Crypto Dashboard – live tracking, portfolio, and trading simulator.">
    <style>
        :root {
            --bg: #0a0f1e;
            --card-bg: rgba(17, 24, 39, 0.75);
            --border: rgba(255, 255, 255, 0.08);
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.3);
            --purple: #8b5cf6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* ── Animated background blobs ── */
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.18;
            animation: blobFloat 8s ease-in-out infinite alternate;
        }

        .blob-1 {
            width: 500px;
            height: 500px;
            background: #3b82f6;
            top: -15%;
            left: -10%;
            animation-delay: 0s;
        }

        .blob-2 {
            width: 400px;
            height: 400px;
            background: #8b5cf6;
            bottom: -10%;
            right: -8%;
            animation-delay: -3s;
        }

        .blob-3 {
            width: 300px;
            height: 300px;
            background: #06b6d4;
            top: 50%;
            left: 60%;
            animation-delay: -5s;
        }

        @keyframes blobFloat {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, -20px) scale(1.1); }
        }

        /* ── Login Card ── */
        .login-card {
            position: relative;
            z-index: 10;
            width: min(420px, 92vw);
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 2.5rem 2.5rem 2rem;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.04) inset;
            animation: cardIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(30px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ── Logo / Branding ── */
        .login-brand {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-coin {
            width: 56px;
            height: 56px;
            background: radial-gradient(circle at 35% 35%, #fde68a, #fbbf24 40%, #d97706 80%, #92400e);
            border: 3px solid #92400e;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #78350f;
            font-weight: 800;
            font-size: 24px;
            box-shadow: 0 0 24px rgba(251, 191, 36, 0.35), inset 0 2px 4px rgba(255, 255, 255, 0.4);
            animation: coinSpin 3s ease-in-out infinite;
            margin-bottom: 1rem;
        }

        @keyframes coinSpin {
            0%, 70%, 100% { transform: perspective(400px) rotateY(0deg); }
            85% { transform: perspective(400px) rotateY(360deg); }
        }

        .login-brand h1 {
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.3rem;
        }

        .login-brand p {
            font-size: 0.88rem;
            color: var(--text-dim);
        }

        /* ── Form ── */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .form-group label {
            font-size: 0.78rem;
            font-weight: 500;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .form-group input {
            padding: 0.75rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
        }

        .form-group input::placeholder {
            color: var(--text-dim);
            opacity: 0.5;
        }

        .form-group input:focus {
            border-color: var(--accent);
            background: rgba(59, 130, 246, 0.06);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .form-extras {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.82rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            color: var(--text-dim);
            cursor: pointer;
        }

        .remember-me input[type="checkbox"] {
            accent-color: var(--accent);
            width: 15px;
            height: 15px;
            cursor: pointer;
        }

        .forgot-link {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .forgot-link:hover {
            color: #60a5fa;
        }

        /* ── Sign In Button ── */
        .signin-btn {
            width: 100%;
            padding: 0.85rem;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.3s, opacity 0.2s;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.3);
            margin-top: 0.3rem;
        }

        .signin-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(59, 130, 246, 0.4);
        }

        .signin-btn:active {
            transform: translateY(0);
        }

        /* ── Divider ── */
        .divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 0.3rem 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .divider span {
            font-size: 0.78rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        /* ── Social Buttons ── */
        .social-buttons {
            display: flex;
            gap: 0.75rem;
        }

        .social-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.7rem 0.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, transform 0.15s;
        }

        .social-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .social-btn:active {
            transform: translateY(0);
        }

        .social-btn svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        /* ── Footer ── */
        .login-footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        .login-footer a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .login-footer a:hover {
            color: #60a5fa;
        }

        /* ── Floating particles ── */
        .particles {
            position: absolute;
            inset: 0;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            animation: particleRise linear infinite;
        }

        @keyframes particleRise {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* ── Reg Details ── */
        .reg-details {
            display: none;
            flex-direction: column;
            gap: 1rem;
            margin-top: 0.5rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .reg-details.show {
            display: flex;
        }

        .login-card h1 {
            transition: all 0.3s;
        }
    </style>
</head>

<body>
    <!-- Background -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <!-- Floating particles -->
    <div class="particles" id="particles"></div>

    <!-- Login Card -->
    <div class="login-card">
        <div class="login-brand">
            <div class="login-coin">₿</div>
            <h1>Crypto Dashboard</h1>
            <p>Sign in to access live market data & trading</p>
        </div>

        <form class="login-form" id="login-form" autocomplete="off">
            <div class="form-group">
                <label for="login-email">Email</label>
                <input type="email" id="login-email" placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" placeholder="Enter your password" required>
            </div>

            <!-- Registration Details (shown on signup) -->
            <div class="reg-details" id="reg-details">
                <div class="divider"><span>Personal Details</span></div>
                <div class="form-group">
                    <label for="reg-name">Full Name</label>
                    <input type="text" id="reg-name" placeholder="Enter your full name">
                </div>
                <div class="form-group">
                    <label for="reg-phone">Phone Number</label>
                    <input type="tel" id="reg-phone" placeholder="e.g., +1 234 567 890">
                </div>
                <div style="display: flex; gap: 0.75rem;">
                    <div class="form-group" style="flex: 1;">
                        <label for="reg-gender">Gender</label>
                        <select id="reg-gender" style="padding: 0.75rem 1rem; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border); border-radius: 12px; color: var(--text);">
                            <option value="">Select</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Non-binary">Non-binary</option>
                            <option value="Other">Other</option>
                            <option value="Prefer not to say">Prefer not to say</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label for="reg-dob">Date of Birth</label>
                        <input type="date" id="reg-dob">
                    </div>
                </div>
                <div class="form-group">
                    <label for="reg-occupation">Occupation</label>
                    <input type="text" id="reg-occupation" placeholder="e.g., Software Developer">
                </div>
            </div>

            <div class="form-extras">
                <label class="remember-me">
                    <input type="checkbox" id="remember-me" checked> Remember me
                </label>
                <a href="#" class="forgot-link" onclick="event.preventDefault();">Forgot password?</a>
            </div>

            <button type="submit" class="signin-btn" id="signin-btn">Sign In</button>

            <div class="divider"><span>or continue with</span></div>

            <div class="social-buttons">
                <button type="button" class="social-btn" id="google-btn" title="Sign in with Google">
                    <svg viewBox="0 0 24 24" fill="none">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18A10.96 10.96 0 001 12c0 1.77.42 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                    Google
                </button>

                <button type="button" class="social-btn" id="apple-btn" title="Sign in with Apple">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C4.24 16.63 4.89 10.53 8.8 10.3c1.2.06 2.04.7 2.75.73.98-.2 1.92-.78 2.98-.7 1.26.1 2.2.6 2.82 1.52-2.58 1.54-1.97 4.92.5 5.85-.46 1.2-.87 2.37-1.8 3.58zM12.03 10.2c-.14-2.35 1.84-4.38 4.04-4.55.3 2.63-2.34 4.6-4.04 4.55z"/>
                    </svg>
                    Apple
                </button>

                <button type="button" class="social-btn" id="github-btn" title="Sign in with GitHub">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 1.27a11 11 0 00-3.48 21.46c.55.1.75-.24.75-.53v-1.85c-3.07.67-3.72-1.48-3.72-1.48a2.93 2.93 0 00-1.23-1.61c-1-.69.08-.67.08-.67a2.32 2.32 0 011.7 1.14 2.36 2.36 0 003.22.92 2.36 2.36 0 01.7-1.48c-2.45-.28-5.02-1.23-5.02-5.47a4.28 4.28 0 011.14-2.97 3.98 3.98 0 01.11-2.93s.93-.3 3.05 1.13a10.5 10.5 0 015.56 0c2.12-1.43 3.05-1.13 3.05-1.13a3.98 3.98 0 01.11 2.93 4.28 4.28 0 011.14 2.97c0 4.25-2.58 5.18-5.04 5.46a2.64 2.64 0 01.75 2.05v3.04c0 .29.2.64.76.53A11 11 0 0012 1.27z"/>
                    </svg>
                    GitHub
                </button>
            </div>
        </form>

        <div class="login-footer" id="login-footer">
            Don't have an account? <a href="#" id="toggle-mode-link">Create one</a>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script>
        /* ── Initialize Supabase ── */
        var cfg = window.CryptoDashConfig || {};
        var sb = null;
        if (typeof supabase !== 'undefined' && cfg.SUPABASE_URL && cfg.SUPABASE_KEY) {
            sb = supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_KEY);
        }

        /* ── Generate floating particles ── */
        (function () {
            var container = document.getElementById('particles');
            for (var i = 0; i < 30; i++) {
                var p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = (6 + Math.random() * 8) + 's';
                p.style.animationDelay = (Math.random() * 10) + 's';
                p.style.width = p.style.height = (2 + Math.random() * 3) + 'px';
                container.appendChild(p);
            }
        })();

        /* ── Auth Logic ── */
        var form = document.getElementById('login-form');
        var emailInput = document.getElementById('login-email');
        var passwordInput = document.getElementById('login-password');
        var signinBtn = document.getElementById('signin-btn');

        form.addEventListener('submit', function (e) {
            e.preventDefault();
            handleAuth('signin');
        });

        /* ── Toggle Modes ── */
        var mode = 'signin';
        var regDetails = document.getElementById('reg-details');
        var toggleLink = document.getElementById('toggle-mode-link');
        var footerText = document.getElementById('login-footer');
        var cardTitle = document.querySelector('.login-brand h1');
        var cardSub = document.querySelector('.login-brand p');

        toggleLink.addEventListener('click', function(e) {
            e.preventDefault();
            if (mode === 'signin') {
                mode = 'signup';
                regDetails.classList.add('show');
                signinBtn.textContent = 'Create Account';
                cardTitle.textContent = 'Join Us';
                cardSub.textContent = 'Fill in your details to get started';
                footerText.innerHTML = 'Already have an account? <a href="#" id="toggle-mode-link">Sign In</a>';
                // Re-bind listener because we just replaced the innerHTML
                document.getElementById('toggle-mode-link').addEventListener('click', arguments.callee);
            } else {
                mode = 'signin';
                regDetails.classList.remove('show');
                signinBtn.textContent = 'Sign In';
                cardTitle.textContent = 'Crypto Dashboard';
                cardSub.textContent = 'Sign in to access live market data & trading';
                footerText.innerHTML = 'Don\'t have an account? <a href="#" id="toggle-mode-link">Create one</a>';
                document.getElementById('toggle-mode-link').addEventListener('click', arguments.callee);
            }
        });

        async function handleAuth(type) {
            if (!sb) {
                alert("Supabase is not configured. Please check js/config.js");
                return;
            }

            var email = emailInput.value;
            var password = passwordInput.value;

            signinBtn.textContent = mode === 'signin' ? 'Signing in…' : 'Creating account…';
            signinBtn.disabled = true;
            signinBtn.style.opacity = '0.7';

            try {
                var result;
                if (mode === 'signin') {
                    result = await sb.auth.signInWithPassword({ email: email, password: password });
                } else {
                    // Registration with metadata
                    var metadata = {
                        full_name: document.getElementById('reg-name').value,
                        phone: document.getElementById('reg-phone').value,
                        gender: document.getElementById('reg-gender').value,
                        dob: document.getElementById('reg-dob').value,
                        occupation: document.getElementById('reg-occupation').value
                    };
                    
                    result = await sb.auth.signUp({ 
                        email: email, 
                        password: password,
                        options: {
                            data: metadata
                        }
                    });

                    // Save locally for demo consistency
                    if (!result.error) {
                        var profileData = {
                            name: metadata.full_name,
                            phone: metadata.phone,
                            gender: metadata.gender,
                            dob: metadata.dob,
                            occupation: metadata.occupation
                        };
                        localStorage.setItem('crypto_user_profile', JSON.stringify(profileData));

                        // If auto-logged in, try to sync to portfolios table immediately
                        if (result.data.session) {
                            try {
                                await sb.from('portfolios').upsert({
                                    user_id: result.data.user.id,
                                    profile: profileData,
                                    updated_at: new Date().toISOString()
                                }, { onConflict: 'user_id' });
                            } catch (e) { console.warn("Initial sync failed", e); }
                        }
                    }
                }

                if (result.error) {
                    alert(result.error.message);
                } else {
                    if (mode === 'signup' && !result.data.session) {
                        alert("Check your email for the confirmation link!");
                    } else {
                        sessionStorage.setItem('crypto_logged_in', 'true');
                        window.location.href = 'index.html';
                    }
                }
            } catch (err) {
                alert("An unexpected error occurred: " + err.message);
            } finally {
                signinBtn.textContent = mode === 'signin' ? 'Sign In' : 'Create Account';
                signinBtn.disabled = false;
                signinBtn.style.opacity = '1';
            }
        }

        /* Social Auth placeholders */
        async function socialAuth(provider) {
            if (!sb) return;
            var { error } = await sb.auth.signInWithOAuth({ provider: provider });
            if (error) alert(error.message);
        }

        document.getElementById('google-btn').addEventListener('click', function() { socialAuth('google'); });
        document.getElementById('apple-btn').addEventListener('click', function() { socialAuth('apple'); });
        document.getElementById('github-btn').addEventListener('click', function() { socialAuth('github'); });
    </script>
</body>

</html>
